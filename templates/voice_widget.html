 <style>
     #voice-control-container {
         position: fixed;
         bottom: 100px; /* Adjusted position */
         right: 20px;
         display: flex;
         flex-direction: column;
         align-items: flex-end;
         z-index: 1000;
         padding-left: 10px; /* Add some padding to the left */
     }
     #voice-control-btn {
         width: 60px;
         height: 60px;
         border-radius: 50%;
         background-color: #007bff; /* Primary blue */
         color: white;
         font-size: 24px;
         border: none;
         cursor: pointer;
         display: flex;
         justify-content: center;
         align-items: center;
         box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
         transition: background-color 0.3s ease;
     }
     #voice-control-btn:hover {
         background-color: #0056b3; /* Darker blue on hover */
     }
     #voice-control-btn.listening {
         background-color: #dc3545; /* Red when listening */
     }
     #voice-control-btn.listening:hover {
         background-color: #c82333;
     }
     #voice-status {
         background-color: rgba(0, 0, 0, 0.7);
         color: white;
         padding: 5px 10px;
         border-radius: 5px;
         margin-top: 5px;
         font-size: 0.85rem;
         display: none; /* Hidden by default */
     }
 </style>

 <div id="voice-control-container">
     <button id="voice-control-btn" title="Activate Voice Assistant">
         <i class="fas fa-microphone"></i>
     </button>
     <div id="voice-status"></div> 
     <!-- Removed 'Idle' text -->

        color: white;

        margin-top: 5px;
        background-color: rgba(0,0,0,0.6);
        padding: 3px 8px;

        white-space: nowrap;

        <p> Voice</p>
        <p> Command</p> -->
    </div>
 </div>

 <script>
     const voiceButton = document.getElementById('voice-control-btn');
    // const voiceStatus = document.getElementById('voice-status');
    let recognition; // SpeechRecognition object
    let isListening = false;
    // Initialize hasGreeted from localStorage, default to false if not set
    let hasGreeted = localStorage.getItem('hasVoiceGreeted') === 'true';
    // Track if the user has denied microphone access so we don't keep asking
    let micPermissionDenied = false;

     function updateStatus(message, show = true) {
        //  voiceStatus.textContent = message;
        //  voiceStatus.style.display = show ? 'block' : 'none';
     }

     // Function to play a simple bubble sound
     function playBubbleSound() {
         try {
             const audioContext = new (window.AudioContext || window.webkitAudioContext)();
             const oscillator = audioContext.createOscillator();
             const gainNode = audioContext.createGain();

             oscillator.connect(gainNode);
             gainNode.connect(audioContext.destination);

             oscillator.type = 'sine'; // Simple sine wave
             oscillator.frequency.setValueAtTime(440, audioContext.currentTime); // A4 note
             gainNode.gain.setValueAtTime(0, audioContext.currentTime);
             gainNode.gain.linearRampToValueAtTime(0.5, audioContext.currentTime + 0.05);
             gainNode.gain.linearRampToValueAtTime(0, audioContext.currentTime + 0.2);

             oscillator.start(audioContext.currentTime);
             oscillator.stop(audioContext.currentTime + 0.2);
         } catch (e) {
             console.warn("Could not play bubble sound:", e);
         }
     }

     // Function to play audio from base64 string
     async function playAudio(base64Audio) {
         if (!base64Audio) {
             console.error("No audio data provided.");
             return;
         }
         const audio = new Audio('data:audio/mp3;base64,' + base64Audio);
         await audio.play();
         return new Promise(resolve => {
             audio.onended = resolve;
             audio.onerror = reject => console.error("Audio playback error:", reject);
         });
     }

     // Function to get speech audio from backend
     async function fetchAndPlaySpeech(text) {
         try {
             updateStatus("Speaking...");
             const response = await fetch('/voice/speak', {
                 method: 'POST',
                 headers: {'Content-Type': 'application/json'},
                 body: JSON.stringify({ text: text })
             });
             const data = await response.json();
             if (data.audio) {
                 await playAudio(data.audio);
             } else if (data.error) {
                 console.error('Error from /voice/speak:', data.error);
                 // Fallback to browser's speech synthesis if backend fails or for simple messages
                 speakBrowser(text);
             }
             updateStatus(""); // Clear status after speaking
         } catch (error) {
             console.error('Error fetching speech from backend:', error);
             // Fallback to browser's speech synthesis
             speakBrowser(text);
             updateStatus(""); // Clear status after speaking
         }
     }

     // Fallback using browser's SpeechSynthesis API
     function speakBrowser(text) {
         if ('speechSynthesis' in window) {
             const utterance = new SpeechSynthesisUtterance(text);
             utterance.lang = 'en-US'; // Set language if needed
             window.speechSynthesis.speak(utterance);
             return new Promise(resolve => { utterance.onend = resolve; });
         } else {
             console.warn('Browser does not support Web Speech Synthesis. Cannot speak:', text);
             return Promise.resolve();
         }
     }

     // Handle voice command processing
     async function processVoiceCommand(commandText) {
         updateStatus("Processing...");
         console.log("Sending command to backend:", commandText);
         try {
             const response = await fetch('/voice/command', {
                 method: 'POST',
                 headers: {'Content-Type': 'application/json'},
                 body: JSON.stringify({ command: commandText })
             });
             const action = await response.json();
             console.log("Received action:", action);

             if (action.message) {
                 await fetchAndPlaySpeech(action.message);
             }

             if (action.type === "redirect" && action.url) {
                 console.log("Redirecting to:", action.url); // Log the redirect URL
                 window.location.href = action.url;
             } else if (action.type === "speak_and_logout") {
                 // Perform logout action (e.g., redirect to logout endpoint)
                 console.log("Logging out and redirecting to:", "{{ url_for('logout') }}");
                 window.location.href = "{{ url_for('logout') }}";
             } else if (action.stop_listening) {
                 stopListening(); // Stop listening if command indicates so
             }
             updateStatus(""); // Clear status after processing

         } catch (error) {
             console.error('Error processing voice command:', error);
             await fetchAndPlaySpeech("There was an error processing your request.");
             updateStatus("Error");
         }
     }

     // Initialize Speech Recognition
     function initSpeechRecognition() {
         if (!('webkitSpeechRecognition' in window)) {
             console.warn("Web Speech API is not supported by this browser. Please use Chrome or Edge.");
             voiceButton.style.display = 'none'; // Hide button if not supported
             updateStatus("Browser not supported", true);
             return;
         }

         recognition = new webkitSpeechRecognition();
         recognition.continuous = false; // Listen for a single utterance
         recognition.interimResults = false; // Don't show interim results
         recognition.lang = 'en-IN'; // Indian English

         recognition.onstart = () => {
             isListening = true;
             voiceButton.classList.add('listening');
             voiceButton.innerHTML = '<i class="fas fa-microphone-alt-slash"></i>'; // Show listening icon
             updateStatus("Listening...");
             document.getElementById('voice-label').textContent = 'Listening...';
             console.log("Voice recognition started.");
         };

         recognition.onresult = (event) => {
             const transcript = event.results[0][0].transcript;
             console.log("User said:", transcript);
             processVoiceCommand(transcript);
         };

        recognition.onerror = async (event) => {
            console.error('Speech recognition error:', event.error);
            isListening = false;
            voiceButton.classList.remove('listening');
            voiceButton.innerHTML = '<i class="fas fa-microphone"></i>';

            if (event.error === 'no-speech') {
                // Give feedback once, but do NOT automatically restart to avoid endless loops
                await fetchAndPlaySpeech("I didn't hear anything. Please try again.");
                updateStatus("No speech detected.");
            } else if (event.error === 'not-allowed') {
                // User denied microphone access – remember this and stop trying to listen
                micPermissionDenied = true;
                await fetchAndPlaySpeech("Microphone access was denied in your browser settings.");
                updateStatus("Microphone access denied. Please allow it in browser settings.");
            } else {
                await fetchAndPlaySpeech("Sorry, I encountered an error. Please try again.");
                updateStatus("Error");
            }
        };

         recognition.onend = () => {
             console.log("Speech recognition ended.");
             isListening = false;
             voiceButton.classList.remove('listening');
             voiceButton.innerHTML = '<i class="fas fa-microphone"></i>';
             updateStatus(""); // Clear status after recognition ends
             document.getElementById('voice-label').textContent = 'Voice command';
         };
     }

    function startListening() {
        // If mic permission was denied, don't keep asking or starting recognition
        if (micPermissionDenied) {
            updateStatus("Microphone access is blocked. Enable it in your browser and reload the page.");
            return;
        }
        if (recognition && !isListening) {
            recognition.start();
        }
    }

     function stopListening() {
         if (recognition && isListening) {
             recognition.stop();
         }
     }

     voiceButton.addEventListener('click', async () => {
        if (isListening) {
            stopListening();
        } else {
            if (!hasGreeted) {
                // Say the greeting only once (tracked via localStorage)
                updateStatus("Speaking: Hello, how can I help you?");
                await fetchAndPlaySpeech("Hello, how can I help you?");
                localStorage.setItem('hasVoiceGreeted', 'true');
                hasGreeted = true;
                startListening(); // Start listening ONLY after greeting is done
            } else {
                // No more greeting after first time – just sound + listen
                playBubbleSound();
                updateStatus("Listening...");
                startListening();
            }
        }
     });

     // Initialize on page load
     document.addEventListener('DOMContentLoaded', () => {
         initSpeechRecognition();
         updateStatus(""); // Initial status is empty
     });
 </script>
